name: WinnowLightning
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  LDKNode:
    path: ../.deps/ldk-node/bindings/swift
targets:
  WinnowLightning:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: LDKNode
        product: LDKNode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btcswift.lightning
        PRODUCT_NAME: WinnowLightning
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "2858MX5336"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
